<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач — учебный пример</title>
  <!-- Лекция 1: подключение стилей -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <!-- Лекция 2: форма добавления (обрабатывается в app.js) -->
    <form id="add-form" class="add-form">
      <input id="title" type="text" placeholder="Новая задача..." autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <ul id="list" class="list">
      <!--
        Лекция 1: пока нет JS, элемент списка можно показать статически:
        <li class="task"><span class="title">Пример задачи</span></li>
        В Лекции 2 список наполняется динамически из app.js.
      -->
    </ul>
  </main>

  <!-- Лекция 2: клиентская логика. store.js — хранение, app.js — интерфейс. -->
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
